spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/coupon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=user
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=debug

spring.data.redis.host=localhost
spring.data.redis.port=6379

coupon.issue.stream.pending.min-idle-time=10s
coupon.issue.stream.pending.claim-count=10
coupon.issue.stream.pending.max-delivery-count=3
coupon.issue.stream.pending.schedule-delay=10s

coupon.issue.stream.dlq.key: coupon:issue:dlq
coupon.issue.stream.dlq.published-set-key: coupon:issue:dlq:published
